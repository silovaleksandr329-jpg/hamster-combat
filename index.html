<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hamster Combat</title>
<style>
:root{--panel:rgba(255,255,255,.1);--accent:#ff9f43;--text:#fff}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',Tahoma,Verdana,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d1a;color:var(--text);touch-action:manipulation}
button{font:inherit;color:inherit}
#loader{position:fixed;inset:0;background:radial-gradient(circle,#222f3e,#10ac84);z-index:1000;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity .5s}
#loader h1{font-size:2.2rem;margin-bottom:16px;animation:pulse 1.2s infinite alternate}
.bar{width:70%;height:14px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden}
.bar div{width:0;height:100%;background:linear-gradient(90deg,#ff9f43,#ff5252)}
#game{width:100%;height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));box-shadow:0 0 30px rgba(0,0,0,.6)}
.panel{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:20px}
.header{padding:12px 15px;text-align:center}
.user-line{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.8rem;opacity:.9;margin-bottom:6px;min-height:28px}
.user-line .who{display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.user-line img{width:24px;height:24px;border-radius:50%}
.mini-btn{background:rgba(255,255,255,.15);border:0;border-radius:10px;padding:5px 10px;font-size:.78rem;cursor:pointer}
.balance{display:flex;justify-content:center;align-items:center;gap:10px;font-size:2rem;font-weight:800;color:#f1c40f;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.balance span:first-child{animation:spin 3s linear infinite;display:inline-block}
.stats{display:flex;justify-content:space-around;font-size:.88rem;opacity:.85;margin-top:4px}
.stats b{color:var(--accent)} .stats .p{color:#2ecc71}
.zone{flex:1;display:flex;justify-content:center;align-items:center;position:relative}
#hamster{height:min(100%,360px);aspect-ratio:1/1;max-width:100%;position:relative;cursor:pointer;touch-action:manipulation;transition:transform .06s}
#hamster.hit{transform:scale(.97)}
#hamster canvas{width:100%;height:100%;display:block}
#hamster .fb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:160px}
#hamster img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
.float{position:absolute;font-size:1.7rem;font-weight:900;pointer-events:none;animation:floatUp .7s ease-out forwards;text-shadow:0 3px 8px rgba(0,0,0,.8),0 0 10px var(--accent);z-index:50}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px}
.nav button{background:rgba(255,255,255,.06);border:0;border-radius:12px;padding:9px 2px;font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.nav button:active{transform:scale(.95);background:rgba(255,255,255,.16)}
.nav .i{font-size:1.35rem}
.modal{position:absolute;left:0;bottom:-100%;width:100%;height:85%;background:#1e1e30;border-radius:28px 28px 0 0;padding:22px 18px;box-shadow:0 -10px 30px rgba(0,0,0,.5);transition:bottom .35s cubic-bezier(.2,.9,.3,1.05);z-index:500;display:flex;flex-direction:column}
.modal.active{bottom:0}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid rgba(255,255,255,.06)}
.mt{font-size:1.3rem;font-weight:700}
.x{background:rgba(255,255,255,.1);border:0;width:36px;height:36px;border-radius:50%;font-size:1.3rem;cursor:pointer}
.mc{flex:1;overflow-y:auto;padding-right:4px}
.item{background:rgba(255,255,255,.05);border-radius:15px;padding:13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid transparent}
.item.on{border-color:#2ecc71;background:rgba(46,204,113,.1)}
.item h4{font-size:1rem;margin-bottom:3px}.item p{font-size:.8rem;opacity:.7}
.item .em{font-size:2rem;margin-right:12px}
.row{display:flex;align-items:center}
.buy{background:linear-gradient(135deg,#ff9f43,#ff5252);border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.buy:disabled{background:#57606f;opacity:.6;cursor:not-allowed}
.buy.ok{background:#2ecc71}.buy.alt{background:#341f97}
.set{margin-bottom:18px}.set label{display:block;font-weight:600;margin-bottom:7px;font-size:.93rem}
.set select,.set input[type=range]{width:100%;padding:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:10px}
.set select option{color:#000}
.box{background:rgba(255,255,255,.04);padding:14px;border-radius:15px;border-left:4px solid var(--accent);margin-top:16px;font-size:.9rem;line-height:1.45}
.box p{margin-bottom:8px}
.mail{color:var(--accent);font-weight:700;text-decoration:none;word-break:break-all;user-select:text;-webkit-user-select:text}
.gbtn{width:100%;background:#fff;color:#222;border:0;border-radius:12px;padding:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.danger{background:#c0392b}
.lb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:7px;background:rgba(255,255,255,.05)}
.lb.me{background:rgba(255,159,67,.18);border:1px solid var(--accent)}
.lb .n{width:28px;font-weight:800;text-align:center}.lb img{width:30px;height:30px;border-radius:50%}
.lb .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.lb .sc{font-weight:700;color:#f1c40f}
.note{font-size:.82rem;opacity:.75;line-height:1.4;margin:8px 0}
#toast{position:absolute;top:70px;left:50%;transform:translate(-50%,-30px);background:#10ac84;padding:10px 16px;border-radius:14px;font-size:.88rem;z-index:900;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.low *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important;text-shadow:none!important;filter:none!important}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.header,.zone,.nav{position:relative;z-index:1}
.nav button{box-shadow:0 4px 0 rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.2)}
.nav button:active{transform:translateY(3px)!important;box-shadow:0 1px 0 rgba(0,0,0,.38)!important}
.buy{box-shadow:0 4px 0 #b53a2a,0 8px 14px rgba(0,0,0,.3)}
.buy.ok{box-shadow:0 4px 0 #1b8f4d}.buy.alt{box-shadow:0 4px 0 #1f1263}.buy:disabled{box-shadow:0 4px 0 #3a4048}
.buy:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #b53a2a}
.header{box-shadow:0 6px 0 rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.35)}
#loader svg{overflow:visible;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4))}
.wheel{transform-origin:100px 105px;animation:rot 2.4s linear infinite}
.hb{animation:hop .3s ease-in-out infinite alternate}
.leg{transform-box:fill-box;transform-origin:50% 0;animation:run .3s ease-in-out infinite alternate}
.leg.b{animation-direction:alternate-reverse}
#loader .sub{margin:6px 0 14px;opacity:.85;font-size:.95rem}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes hop{to{transform:translateY(-4px)}}
@keyframes run{from{transform:rotate(35deg)}to{transform:rotate(-35deg)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes spin{to{transform:rotateY(360deg)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-20px) scale(1.1)}100%{opacity:0;transform:translateY(-110px) scale(.8)}}
</style>
</head>
<body>
<div id="loader"><h1>HAMSTER COMBAT</h1>
<svg viewBox="0 0 200 200" width="210" height="210">
<g class="wheel" stroke="#ffd27f" fill="none"><circle cx="100" cy="105" r="82" stroke-width="7"/><path stroke-width="3" opacity=".8" d="M100 105L182 105M100 105L158 163M100 105L100 187M100 105L42 163M100 105L18 105M100 105L42 47M100 105L100 23M100 105L158 47"/></g>
<g class="hb">
<ellipse class="leg b" cx="86" cy="172" rx="7" ry="10" fill="#c27a35"/>
<circle cx="66" cy="150" r="5" fill="#d08a40"/>
<ellipse cx="100" cy="148" rx="34" ry="26" fill="#e9a55d"/>
<ellipse cx="104" cy="156" rx="24" ry="16" fill="#fff0d6"/>
<ellipse class="leg" cx="114" cy="172" rx="7" ry="10" fill="#d89548"/>
<circle cx="134" cy="136" r="20" fill="#e9a55d"/>
<circle cx="126" cy="118" r="7" fill="#e9a55d"/><circle cx="126" cy="118" r="4" fill="#ffa6b5"/>
<circle cx="138" cy="146" r="8" fill="#f7cf9a"/>
<circle cx="142" cy="133" r="3.2" fill="#111"/><circle cx="143" cy="132" r="1" fill="#fff"/>
<circle cx="153" cy="139" r="2.6" fill="#ffa6b5"/>
</g></svg>
<div class="sub">Хомяк разминается…</div><div class="bar"><div id="lf"></div></div></div>

<div id="game"><canvas id="fx"></canvas>
  <div class="panel header">
    <div class="user-line"><div class="who" id="who">Гость (прогресс только на этом устройстве)</div><button class="mini-btn" id="hdrAuth" onclick="doSignIn()">Войти через Google</button></div>
    <div class="balance"><span>🪙</span><span id="bal">0</span></div>
    <div class="stats"><div>Тап: <b id="cp">+1</b></div><div>Пассивно: <b class="p" id="pi">+0/с</b></div></div>
  </div>

  <div class="zone"><div id="hamster"><canvas id="c3d"></canvas><img id="ph" class="photo" alt=""><div class="fb" id="fb"></div></div></div>

  <div class="panel nav">
    <button onclick="openModal('m-up')"><span class="i">⚡</span>Улучшения</button>
    <button onclick="openModal('m-skin')"><span class="i">👕</span>Скины</button>
    <button onclick="openModal('m-bg')"><span class="i">🖼️</span>Фоны</button>
    <button onclick="openModal('m-top')"><span class="i">🏆</span>Топ</button>
    <button onclick="openModal('m-set')"><span class="i">⚙️</span>Опции</button>
  </div>

  <div id="m-up" class="modal"><div class="mh"><div class="mt">⚡ Улучшения</div><button class="x" onclick="closeModals()">×</button></div><div class="mc" id="l-up"></div></div>
  <div id="m-skin" class="modal"><div class="mh"><div class="mt">👕 Гардероб</div><button class="x" onclick="closeModals()">×</button></div><div class="mc" id="l-skin"></div></div>
  <div id="m-bg" class="modal"><div class="mh"><div class="mt">🖼️ Локации</div><button class="x" onclick="closeModals()">×</button></div><div class="mc" id="l-bg"></div></div>

  <div id="m-top" class="modal"><div class="mh"><div class="mt">🏆 Таблица лидеров</div><button class="x" onclick="closeModals()">×</button></div>
    <div class="mc"><div id="lb-auth"></div><div id="lb-list"></div></div></div>

  <div id="m-set" class="modal"><div class="mh"><div class="mt">⚙️ Настройки</div><button class="x" onclick="closeModals()">×</button></div>
    <div class="mc">
      <div class="set"><label>Аккаунт</label><div id="set-auth"></div></div>
      <div class="set"><label>Качество графики</label>
        <select id="gfx" onchange="applySettings(true)"><option value="high">Ультра-Хомяк (эффекты, блюр)</option><option value="low">Экономный Картофель (для FPS)</option></select></div>
      <div class="set"><label>Громкость тапов</label><input type="range" id="vol" min="0" max="100" value="70" oninput="applySettings(true)"></div>
      <div class="set"><label>Фоновая музыка</label>
        <select id="mus" onchange="applySettings(true)"><option value="off">Выключена</option><option value="on">Весёлый бит (синтезатор)</option></select></div>
      <div class="box">
        <p><b>Версия:</b> 0.3 Alpha</p>
        <p>Если вы заметили баг или хотите поддержать проект — пишите мне:</p>
        <p>📧 <a class="mail" href="mailto:Silovaleksandr329@gmail.com">Silovaleksandr329@gmail.com</a></p>
      </div>
      <div class="set" style="margin-top:16px"><button class="buy danger" style="width:100%" onclick="resetGame()">Сбросить прогресс</button></div>
    </div>
  </div>
  <div id="toast"></div>
</div>

<script>
/* ===== Данные ===== */
const UPGRADES=[
 {id:'finger',name:'Тренировка пальцев',desc:'+1 к силе тапа',base:50,mult:1.55,tap:1},
 {id:'seed',name:'Золотая семечка',desc:'+4 к силе тапа',base:400,mult:1.6,tap:4},
 {id:'drink',name:'Энергетик Хомяка',desc:'+20 к силе тапа',base:3000,mult:1.65,tap:20},
 {id:'squirrel',name:'Авто-кликер «Белка»',desc:'+2 монеты/с',base:200,mult:1.5,pas:2},
 {id:'farm',name:'Хомячья ферма',desc:'+12 монет/с',base:1800,mult:1.55,pas:12},
 {id:'factory',name:'Семечковый завод',desc:'+60 монет/с',base:12000,mult:1.6,pas:60}
];
// Чтобы поставить свою AI-картинку: добавьте поле photo:'skins/ninja.png' (скин) или photo:'bg/space.jpg' (фон)
const SKINS=[
 {id:'default',name:'Обычный хомяк',cost:0,e:'🐹',c:'#e9a55d'},{id:'ninja',name:'Хомяк-ниндзя',cost:500,e:'🥷',c:'#4a4f5c'},
 {id:'king',name:'Король хомяков',cost:2500,e:'🤴',c:'#ffc400'},{id:'robot',name:'Кибер-Хома 3000',cost:8000,e:'🤖',c:'#9aa6b5'},
 {id:'alien',name:'Инопланетянин',cost:25000,e:'👽',c:'#7be07b'}
];
const BGS=[
 {id:'default',name:'Уютная клетка',cost:0,fx:'default',s:'radial-gradient(circle at 50% 35%,#4a3b2c,#120d09)'},
 {id:'matrix',name:'Код Матрицы',cost:300,fx:'matrix',s:'radial-gradient(circle,#06180b,#000)'},
 {id:'neon',name:'Неон-синтвейв',cost:1500,fx:'neon',s:'linear-gradient(#1a0b3d 0%,#4a0f6b 52%,#12002b 52%)'},
 {id:'space',name:'Космический полёт',cost:5000,fx:'space',s:'radial-gradient(circle at 50% 40%,#1b1740,#06040a)'}
];
const MAIL='Silovaleksandr329@gmail.com';
const KEY='hamster_combat_v3';
const fresh=()=>({coins:0,total:0,levels:{},skin:'default',bg:'default',skins:['default'],bgs:['default'],last:Date.now(),set:{gfx:'high',vol:70,mus:'off'}});
let S=fresh(), user=null, dirty=false, lastSync=0;

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const fmt=n=>{n=Math.floor(n);if(n<1e4)return n.toLocaleString('ru');const u=['','K','M','B','T'];let i=0,v=n;while(v>=1000&&i<u.length-1){v/=1000;i++}return v.toFixed(v<100?2:1).replace(/\.?0+$/,'')+u[i]};
const lvl=id=>S.levels[id]||0;
const cost=u=>Math.floor(u.base*Math.pow(u.mult,lvl(u.id)));
const tapPower=()=>1+UPGRADES.reduce((a,u)=>a+(u.tap||0)*lvl(u.id),0);
const passive=()=>UPGRADES.reduce((a,u)=>a+(u.pas||0)*lvl(u.id),0);

/* ===== Сохранение ===== */
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r));}catch(e){}}
function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}

/* ===== UI ===== */
function updateTop(){$('bal').textContent=fmt(S.coins);$('cp').textContent='+'+fmt(tapPower());$('pi').textContent='+'+fmt(passive())+'/с'}
function renderUp(){
 $('l-up').innerHTML=UPGRADES.map(u=>`<div class="item"><div><h4>${u.name} <small style="opacity:.6">ур. ${lvl(u.id)}</small></h4><p>${u.desc}</p></div>
 <button class="buy" ${S.coins>=cost(u)?'':'disabled'} onclick="buyUp('${u.id}')">🪙 ${fmt(cost(u))}</button></div>`).join('');
}
function renderSkins(){
 $('l-skin').innerHTML=SKINS.map(k=>{const own=S.skins.includes(k.id),on=S.skin===k.id;
  const b=on?'<button class="buy ok" disabled>Надет</button>':own?`<button class="buy alt" onclick="equip('skin','${k.id}')">Надеть</button>`:`<button class="buy" ${S.coins>=k.cost?'':'disabled'} onclick="buy('skin','${k.id}')">🪙 ${fmt(k.cost)}</button>`;
  return `<div class="item ${on?'on':''}"><div class="row"><span class="em" style="width:40px;height:40px;border-radius:50%;display:inline-block;background:radial-gradient(circle at 35% 30%,#fff9,${k.c})"></span><div><h4>${k.name}</h4></div></div>${b}</div>`}).join('');
}
function renderBgs(){
 $('l-bg').innerHTML=BGS.map(k=>{const own=S.bgs.includes(k.id),on=S.bg===k.id;
  const b=on?'<button class="buy ok" disabled>Активен</button>':own?`<button class="buy alt" onclick="equip('bg','${k.id}')">Выбрать</button>`:`<button class="buy" ${S.coins>=k.cost?'':'disabled'} onclick="buy('bg','${k.id}')">🪙 ${fmt(k.cost)}</button>`;
  return `<div class="item ${on?'on':''}"><div class="row"><span class="em" style="width:36px;height:36px;border-radius:10px;background:${k.s};display:inline-block"></span><div><h4>${k.name}</h4></div></div>${b}</div>`}).join('');
}
let openId=null;
function renderOpen(){if(openId==='m-up')renderUp();else if(openId==='m-skin')renderSkins();else if(openId==='m-bg')renderBgs()}
function openModal(id){closeModals();openId=id;$(id).classList.add('active');renderOpen();if(id==='m-top')loadBoard();if(id==='m-set')renderAuth()}
function closeModals(){openId=null;document.querySelectorAll('.modal').forEach(m=>m.classList.remove('active'))}
function applyLook(){
 const sk=SKINS.find(x=>x.id===S.skin)||SKINS[0],ph=$('ph'),fb=$('fb'),has3d=!!window.H3D&&!sk.photo;
 $('c3d').style.display=has3d?'block':'none';
 ph.style.display=sk.photo?'block':'none';if(sk.photo)ph.src=sk.photo;
 fb.style.display=(!has3d&&!sk.photo)?'flex':'none';fb.textContent=sk.e;
 if(window.H3D)H3D.setSkin(S.skin);
 setFx(S.bg);
}

/* ===== Покупки ===== */
function buyUp(id){const u=UPGRADES.find(x=>x.id===id);const c=cost(u);if(S.coins<c)return;S.coins-=c;S.levels[id]=lvl(id)+1;sfx('buy');dirty=true;updateTop();renderOpen();save()}
function buy(type,id){const list=type==='skin'?SKINS:BGS,arr=type==='skin'?S.skins:S.bgs,it=list.find(x=>x.id===id);
 if(!it||arr.includes(id)||S.coins<it.cost)return;S.coins-=it.cost;arr.push(id);sfx('buy');equip(type,id)}
function equip(type,id){if(type==='skin')S.skin=id;else S.bg=id;sfx('equip');applyLook();updateTop();renderOpen();save();dirty=true}

/* ===== Клик ===== */
const hm=$('hamster');
hm.addEventListener('pointerdown',e=>{
 e.preventDefault();wake();
 const p=tapPower();S.coins+=p;S.total+=p;dirty=true;
 $('bal').textContent=fmt(S.coins);
 hm.classList.add('hit');setTimeout(()=>hm.classList.remove('hit'),70);
 tapSound();window.H3D&&H3D.tap();float(e.clientX,e.clientY,'+'+fmt(p));
});
function float(x,y,t){
 const g=$('game'),r=g.getBoundingClientRect(),el=document.createElement('div');el.className='float';el.textContent=t;
 el.style.left=(x-r.left-15)+'px';el.style.top=(y-r.top-20)+'px';
 if(Math.random()<.12){const ph=['ХОМЯК КРАШ!','ТАПАЙ ЕЩЁ!','МАЙНИНГ!','PUMP!','ЛИСТИНГ СКОРО!'];el.textContent=ph[Math.random()*ph.length|0];el.style.color='#54a0ff';el.style.fontSize='1.2rem'}
 g.appendChild(el);setTimeout(()=>el.remove(),700);
}

/* ===== Звук (Web Audio: реверб, компрессор, шум-«хруст», секвенсор) ===== */
let ac=null,master=null,verb=null,mi=null;
function wake(){try{
 if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();const comp=ac.createDynamicsCompressor();master=ac.createGain();master.connect(comp);comp.connect(ac.destination);
  const len=ac.sampleRate*1.4,buf=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
  verb=ac.createConvolver();verb.buffer=buf;const vg=ac.createGain();vg.gain.value=.3;verb.connect(vg);vg.connect(master)}
 if(ac.state==='suspended')ac.resume()}catch(e){}}

<script type="module">
/* ===== Firebase: вход через Google + общая таблица лидеров =====
   1) console.firebase.google.com → создать проект → Add app (Web) → скопировать config сюда.
   2) Authentication → Sign-in method → включить Google.
      Authentication → Settings → Authorized domains → добавить домен, где лежит игра.
   3) Firestore Database → создать → вставить правила (см. ниже).
   Правила Firestore:
     rules_version = '2';
     service cloud.firestore { match /databases/{db}/documents {
       match /players/{uid} {
         allow read: if true;
         allow write: if request.auth != null && request.auth.uid == uid
           && request.resource.data.score is int
           && request.resource.data.name is string && request.resource.data.name.size() < 60;
       } } }
*/
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: ""
};

if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId) {
  try {
    const V = "10.12.2", B = `https://www.gstatic.com/firebasejs/${V}/`;
    const { initializeApp } = await import(B + "firebase-app.js");
    const A = await import(B + "firebase-auth.js");
    const F = await import(B + "firebase-firestore.js");
    const app = initializeApp(FIREBASE_CONFIG);
    const auth = A.getAuth(app), db = F.getFirestore(app);
    window.cloud = {
      ready: true,
      async signIn() {
        const p = new A.GoogleAuthProvider();
        try { await A.signInWithPopup(auth, p); }
        catch (e) {
          if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") await A.signInWithRedirect(auth, p);
          else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") throw e;
        }
      },
      signOut: () => A.signOut(auth),
      async getMe(uid) { const s = await F.getDoc(F.doc(db, "players", uid)); return s.exists() ? s.data() : null; },
      setMe: (uid, data) => F.setDoc(F.doc(db, "players", uid), { ...data, updatedAt: F.serverTimestamp() }),
      async top(n) {
        const q = F.query(F.collection(db, "players"), F.orderBy("score", "desc"), F.limit(n));
        return (await F.getDocs(q)).docs.map(d => ({ id: d.id, name: d.data().name, photo: d.data().photo, score: d.data().score || 0 }));
      }
    };
    A.onAuthStateChanged(auth, u => onUser(u));
    renderAuth();
  } catch (e) { console.error("Firebase init failed", e); }
}
</script>

function fit(){const r=wrap.getBoundingClientRect();if(!r.width)return;ren.setPixelRatio(Math.min(devicePixelRatio||1,document.body.classList.contains('low')?1:2));ren.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}
new ResizeObserver(fit).observe(wrap);fit();
let last=performance.now(),squash=0,vel=0;const tgt={x:0,y:0};
const aim=e=>{tgt.y=(e.clientX/innerWidth-.5)*.9;tgt.x=(e.clientY/innerHeight-.5)*.5};
addEventListener('pointermove',aim);addEventListener('pointerdown',aim);
function frame(now){requestAnimationFrame(frame);if(document.hidden||cv.style.display==='none'){last=now;return}
 const dt=Math.min(.033,(now-last)/1000);last=now;const ts=now/1000;
 vel+=(-160*squash-10*vel)*dt;squash+=vel*dt;tgt.x*=.985;tgt.y*=.985;
 root.rotation.y+=((tgt.y+Math.sin(ts*.9)*.15)-root.rotation.y)*.12;root.rotation.x+=(tgt.x-root.rotation.x)*.12;
 const sy=1-squash*.22;root.scale.set(1+squash*.16,sy,1+squash*.16);root.position.y=-2.4*(1-sy)+Math.sin(ts*2.2)*.08;
 ren.render(scene,cam)}
requestAnimationFrame(frame);
window.H3D={setSkin(id){root.remove(cur);cur=build(id);root.add(cur)},tap(){squash=.8;vel=0}};
window.h3dState='ok';if(typeof applyLook==='function')applyLook();
}catch(e){console.error('3D недоступен, включён запасной режим',e);window.h3dState='fail';if(typeof applyLook==='function')applyLook()}
